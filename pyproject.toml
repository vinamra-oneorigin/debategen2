[project]
name = "async-podcast-generator"
version = "0.1.0"
description = "Fast, optimized Gradio app that converts PDFs to AI-generated debate podcasts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Dependencies
    "PyPDF2>=3.0.0",
    "openai>=1.0.0",
    "gradio>=5.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Audio Processing
    "pydub>=0.25.0",
    "soundfile>=0.12.0",
    # Async Processing
    "aiohttp>=3.8.0",
    "tenacity>=8.0.0",
    # Data Processing
    "pandas>=1.5.0",
    "numpy<2.0",
    # Text-to-Speech
    "elevenlabs>=0.2.0",
    # Logging
    "loguru>=0.7.0",
    # Optional - For enhanced functionality
    "requests>=2.28.0",
    "pdfplumber>=0.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
